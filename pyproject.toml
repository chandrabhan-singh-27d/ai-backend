[project]
name = "ai-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.122.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "mcp>=2.0.0",
    "openai>=3.2.0",
    "prometheus-client>=0.26.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=6.0.0",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["app", "servers"]
