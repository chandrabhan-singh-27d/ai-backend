groups:
  - name: rag-sli
    rules:
      - record: ai_backend:error_ratio:5m
        expr: |
          sum by () (rate(http_requests_total{job="ai-backend", status=~"5.."}[5m]))
          /
          sum by () (rate(http_requests_total{job="ai-backend"}[5m]))
      - record: ai_backend:success_ratio:5m
        expr: 1 - ai_backend:error_ratio:5m