groups:
  - name: rag-sli
    rules:
      - record: ai_backend:error_ratio:5m
        expr: |
          (sum by () (rate(http_requests_total{job="ai-backend", status=~"5.."}[5m])) or on() vector(0))
          /
          clamp_min(sum by () (rate(http_requests_total{job="ai-backend"}[5m])), 1)
      - record: ai_backend:success_ratio:5m
        expr: 1 - ai_backend:error_ratio:5m
